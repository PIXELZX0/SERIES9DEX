name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not `stable`: the action resolves `stable` at run time, so
          # every job silently picks up whatever Foundry shipped that morning.
          # v1.8.3's post-build lint pass hangs on this project (compiles fine,
          # then spins until the runner drops the job), which is exactly how
          # CI broke without a single commit touching it.
          version: v1.5.1

      - name: Check formatting
        run: forge fmt --check
        continue-on-error: true

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

      - name: Gas snapshot check
        run: forge snapshot --check
        continue-on-error: true
