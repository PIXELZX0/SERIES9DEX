name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not `stable`: the action resolves `stable` at run time, so
          # every job silently picks up whatever Foundry shipped that morning,
          # which is how CI broke with no commit touching it.
          #
          # The compiler is pinned separately in foundry.toml, so this version
          # does not decide the deployed bytecode — verified identical under
          # v1.5.1 and v1.8.3 for all nine deployable contracts.
          version: v1.8.3

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv

      # Blocking: .gas-snapshot is committed, so a drift here means either a
      # gas change nobody looked at or a stale snapshot. Both want a human.
      #
      # Tolerance because the fuzz seed is not pinned, so fuzz tests report a
      # slightly different mean every run and an exact match is unachievable —
      # it was luck that this passed at all when the step first became blocking.
      # Real regressions are orders of magnitude larger than this band.
      - name: Gas snapshot check
        run: forge snapshot --check --tolerance 1
