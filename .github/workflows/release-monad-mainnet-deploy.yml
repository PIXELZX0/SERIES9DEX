name: Release Monad Mainnet Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monad-dex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy DEX stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      SAFE_ADDRESS: ${{ secrets.SAFE_ADDRESS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${MONAD_RPC_URL:?GitHub secret MONAD_RPC_URL is required}"
          : "${PRIVATE_KEY:?GitHub secret PRIVATE_KEY is required}"
          : "${SAFE_ADDRESS:?GitHub secret SAFE_ADDRESS is required}"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry version
        run: forge --version

      - name: Build contracts
        env:
          FOUNDRY_PROFILE: deploy
        run: forge build

      - name: Test before deploying
        run: forge test

      - name: Generate ABI JSON files
        id: abi
        shell: bash
        run: |
          set -euo pipefail

          REF_SLUG="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          REF_SLUG="${REF_SLUG##-}"
          REF_SLUG="${REF_SLUG%%-}"
          if [[ -z "$REF_SLUG" ]]; then
            REF_SLUG="run-${GITHUB_RUN_ID}"
          fi

          ABI_DIR="release-abis-${REF_SLUG}"
          mkdir -p "$ABI_DIR"

          for name in DexRegistry ProtocolTreasury Orderbook SpotPool SpotPoolFactory PerpPool PerpPoolFactory; do
            jq '.abi' "out/${name}.sol/${name}.json" > "$ABI_DIR/${name}.abi.json"
          done

          echo "abi_dir=$ABI_DIR" >> "$GITHUB_OUTPUT"
          echo "ref_slug=$REF_SLUG" >> "$GITHUB_OUTPUT"

      - name: Deploy DEX stack
        id: deploy
        env:
          FOUNDRY_PROFILE: deploy
          REF_SLUG: ${{ steps.abi.outputs.ref_slug }}
        shell: bash
        run: |
          set -euo pipefail

          forge script script/DeployDex.s.sol:DeployDex \
            --rpc-url "$MONAD_RPC_URL" \
            --broadcast \
            --json | tee forge-script-output.json

          # The broadcast file is the authoritative record of what actually landed on chain.
          BROADCAST="broadcast/DeployDex.s.sol/143/run-latest.json"
          if [[ ! -f "$BROADCAST" ]]; then
            echo "Broadcast file not found at $BROADCAST" >&2
            exit 1
          fi

          RUN_FILE="release-deploy-${REF_SLUG}.json"
          jq --arg chainId "143" \
             --arg safe "$SAFE_ADDRESS" \
             --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            {
              chainId: $chainId,
              safeOwner: $safe,
              generatedAt: $generatedAt,
              contracts: [
                .transactions[]
                | select(.transactionType == "CREATE" or .transactionType == "CREATE2")
                | {name: .contractName, address: .contractAddress, txHash: .hash}
              ]
            }' "$BROADCAST" > "$RUN_FILE"

          jq -e '.contracts | length > 0' "$RUN_FILE" >/dev/null

          echo "run_file=$RUN_FILE" >> "$GITHUB_OUTPUT"
          echo "broadcast=$BROADCAST" >> "$GITHUB_OUTPUT"

      - name: Verify contracts
        env:
          SKIP_VERIFY_INPUT: ${{ vars.SKIP_VERIFY }}
          SOURCIFY_VERIFIER_URL: https://sourcify-api-monad.blockvision.org
          SOCIALSCAN_VERIFIER_URL: https://api.socialscan.io/monad/v1/explorer/command_api/contract
          RUN_FILE: ${{ steps.deploy.outputs.run_file }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SKIP_VERIFY_INPUT:-false}" == "true" ]]; then
            echo "Skipping verification (SKIP_VERIFY=true)."
            exit 0
          fi

          # Proxies are verified as ERC1967Proxy; implementations by their own name.
          while read -r name address; do
            [[ -z "$name" || -z "$address" ]] && continue
            case "$name" in
              ERC1967Proxy) path="lib/openzeppelin-contracts/contracts/proxy/ERC1967/ERC1967Proxy.sol:ERC1967Proxy" ;;
              *)            path="src/${name}.sol:${name}" ;;
            esac

            echo "Verifying ${name} at ${address}..."
            forge verify-contract "$address" "$path" \
              --chain 143 --rpc-url "$MONAD_RPC_URL" \
              --verifier sourcify --verifier-url "$SOURCIFY_VERIFIER_URL" \
              || echo "::warning title=Sourcify verification failed::${name} (${address})"

            forge verify-contract "$address" "$path" \
              --chain 143 --rpc-url "$MONAD_RPC_URL" \
              --verifier blockscout --verifier-url "$SOCIALSCAN_VERIFIER_URL" \
              || echo "::warning title=SocialScan verification failed::${name} (${address})"
          done < <(jq -r '.contracts[] | "\(.name) \(.address)"' "$RUN_FILE")

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monad-dex-release-${{ steps.abi.outputs.ref_slug }}
          if-no-files-found: error
          path: |
            ${{ steps.deploy.outputs.run_file }}
            ${{ steps.deploy.outputs.broadcast }}
            ${{ steps.abi.outputs.abi_dir }}

      - name: Attach artifacts to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.deploy.outputs.run_file }}
            ${{ steps.abi.outputs.abi_dir }}/*.json

      - name: Write job summary
        env:
          RUN_FILE: ${{ steps.deploy.outputs.run_file }}
        shell: bash
        run: |
          {
            echo "## Series9DEX Monad Mainnet deployment"
            echo ""
            echo "- Release: \`${GITHUB_REF_NAME}\`"
            echo "- Safe owner: \`${SAFE_ADDRESS}\`"
            echo ""
            echo "| Contract | Address |"
            echo "|---|---|"
            jq -r '.contracts[] | "| \(.name) | `\(.address)` |"' "$RUN_FILE"
          } >> "$GITHUB_STEP_SUMMARY"
