[profile.default]
src = "src"
out = "out"
libs = ["lib"]
use_literal_content = true
bytecode_hash = "none"
via_ir = true
optimizer = true
optimizer_runs = 200
# Pinned: without it the compiler is whatever the local toolchain resolves
# from `^0.8.22`, so the same commit produces different deployed bytecode on
# different machines and Sourcify verification depends on who ran the deploy.
solc_version = "0.8.33"
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.deploy]
optimizer = true
optimizer_runs = 200
via_ir = true
# Pinned: without it the compiler is whatever the local toolchain resolves
# from `^0.8.22`, so the same commit produces different deployed bytecode on
# different machines and Sourcify verification depends on who ran the deploy.
solc_version = "0.8.33"
fs_permissions = [{ access = "read-write", path = "./" }]

# Lints are advisory here and are run on demand, not as part of every build.
# Independently of the pinned toolchain above, this keeps a slow or hanging
# lint pass from being able to take the build down with it.
[lint]
lint_on_build = false

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad = "${MONAD_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
